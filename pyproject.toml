[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-utils-sdk"
version = "0.1.0"
description = "Reusable building blocks for message-driven AI agents: NATS messaging, LLM chat, WhatsApp and speech."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcus Stinghel" }]
keywords = ["agents", "nats", "openai", "whatsapp", "speech", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
nats = ["nats-py>=2.9"]
openai = ["openai>=1.40"]
whatsapp = ["httpx>=0.27"]
google = ["google-cloud-speech>=2.26", "google-cloud-texttospeech>=2.16", "soundfile>=0.12", "resampy>=0.4.3", "numpy>=1.26"]
all = ["agent-utils-sdk[nats,openai,whatsapp,google]"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]
dev = ["agent-utils-sdk[all,test]", "build>=1.2", "twine>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_utils_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m \"not integration\""
markers = ["integration: tests that need a running external service (deselected by default)"]
